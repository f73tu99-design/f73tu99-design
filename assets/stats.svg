    <text class="m" x="335.4" y="79" font-size="10" fill="#a19b90">day streak</text>
  </g>

  <rect x="24" y="126" width="392" height="6" rx="3" fill="#262d36"/>
  <g clip-path="url(#st-bar)">
    <rect class="growX" x="24" y="126" width="389" height="6" fill="#4ec9b0" fill-opacity=".38" style="animation-delay:.26s"/>
    <rect class="growX" x="413" y="126" width="3" height="6" fill="#4ec9b0" style="animation-delay:.34s"/>
  </g>
  <defs><clipPath id="st-bar"><rect x="24" y="126" width="392" height="6" rx="3"/></clipPath></defs>

  <g class="r" style="animation-delay:.30s">
    <circle cx="28" cy="150" r="3.5" fill="#4ec9b0" fill-opacity=".38"/>
    <text class="m" x="38" y="154" font-size="10.5" fill="#a19b90">3k private</text>
    <circle cx="150" cy="150" r="3.5" fill="#4ec9b0"/>
