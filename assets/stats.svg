<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 224" width="440" height="224" role="img" aria-label="GitHub statistics for f73tu99-design: 2981 contributions in the last 12 months, of which 2956 are private and 25 public. 16 repositories, 0 stars, 3 followers, 44 day streak.">
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace} .s{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .lbl{fill:#4ec9b0;font-size:10px;letter-spacing:.17em;opacity:.8}
    .sec{fill:#8e887d;font-size:10px;letter-spacing:.18em}
    .cap{fill:#8e887d;font-size:9.5px;letter-spacing:.04em}
    .val{fill:#f3eee4;font-size:14.5px}
    .r{animation:fadeUp .7s cubic-bezier(.2,.7,.3,1) both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    .growX{transform-box:fill-box;transform-origin:left center;animation:growX .9s cubic-bezier(.2,.8,.3,1) both}
    @keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .growY{transform-box:fill-box;transform-origin:bottom center;animation:growY .8s cubic-bezier(.2,.8,.3,1) both}
    @keyframes growY{from{transform:scaleY(.02)}to{transform:scaleY(1)}}
    .draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.6s cubic-bezier(.4,0,.2,1) .5s both}
    @keyframes draw{to{stroke-dashoffset:0}}
    .breathe{animation:breathe 3.2s ease-in-out infinite}
    @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
    .glowt{animation:glowt 3.4s ease-in-out infinite}
    @keyframes glowt{0%,100%{opacity:.16}50%{opacity:.42}}
    @media (prefers-reduced-motion:reduce){*{animation:none !important}}
  </style>

  <defs>
