    <pattern id="st-card-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f3eee4" fill-opacity=".07"/>
    </pattern>
    <linearGradient id="st-card-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4ec9b0" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#4ec9b0" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#4ec9b0" stop-opacity="0"/>
    </linearGradient>
    <filter id="st-card-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <g clip-path="url(#st-card)">
    <rect x="0" y="0" width="440" height="224" fill="#1c2129"/>
