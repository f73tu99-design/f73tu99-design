  <text class="s glowt" x="24" y="86" font-size="32" font-weight="650" fill="#4ec9b0" filter="url(#st-card-glow)">3k</text>
  <text class="s r" x="24" y="86" font-size="32" font-weight="650" fill="#f3eee4" style="animation-delay:.14s">3k</text>
  <text class="m r" x="24" y="105" font-size="10.5" fill="#a19b90" style="animation-delay:.20s">contributions &#183; last 12 months</text>

  <g class="r" style="animation-delay:.24s">
    <rect x="300" y="60" width="116" height="30" rx="8" fill="#262d36" stroke="#363f4a"/>
