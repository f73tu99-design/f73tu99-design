<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 282" width="900" height="282" role="img"
     aria-label="Request lifecycle diagram. A request travels from browser to edge to API to service to database, then a 200 OK response returns along the same path.">
  <title>Request lifecycle &#8212; browser to database and back</title>

  <defs>
    <clipPath id="a-card"><rect x="1" y="1" width="898" height="280" rx="14"/></clipPath>
    <pattern id="a-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#e6edf3" fill-opacity=".035"/>
    </pattern>
    <linearGradient id="a-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ec9b0" stop-opacity="0"/><stop offset="50%" stop-color="#4ec9b0" stop-opacity=".55"/><stop offset="100%" stop-color="#4ec9b0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="a-trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ec9b0" stop-opacity="0"/><stop offset="100%" stop-color="#4ec9b0" stop-opacity=".6"/>
    </linearGradient>
    <filter id="a-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <style>
    .m {font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .s {font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .h {fill:#e6edf3;font-size:17px;font-weight:620;letter-spacing:-.2px}
    .sub{fill:#636e7b;font-size:11px}
    .sec{fill:#636e7b;font-size:10px;letter-spacing:.18em}
    .lbl{fill:#636e7b;font-size:10px;letter-spacing:.16em}
    .step{fill:#4d5560;font-size:9.5px;letter-spacing:.14em}
    .nd {fill:#e6edf3;font-size:12.5px}
    .nsub{fill:#636e7b;font-size:10px}

    .r{animation:fadeUp .7s cubic-bezier(.2,.7,.3,1) both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}

    .node{animation:lit 7s ease-in-out infinite}
    .halo{animation:halo 7s ease-in-out infinite;opacity:0}
    .n1{animation-delay:0s} .n2{animation-delay:.875s} .n3{animation-delay:1.75s}
    .n4{animation-delay:2.625s} .n5{animation-delay:3.5s}
    @keyframes lit {0%,3%{stroke:#4ec9b0}16%,100%{stroke:#21262d}}
    @keyframes halo{0%,3%{opacity:.35}16%,100%{opacity:0}}

    .req{animation:req 7s linear infinite}
    @keyframes req{0%{transform:translateX(0);opacity:0}3%{opacity:1}50%{transform:translateX(680px);opacity:1}55%,100%{transform:translateX(680px);opacity:0}}
    .res{animation:res 7s linear infinite}
    @keyframes res{0%,56%{transform:translateX(680px);opacity:0}60%{opacity:1}96%{transform:translateX(0);opacity:1}100%{transform:translateX(0);opacity:0}}
    .flow{stroke-dasharray:3 5;animation:flow 1.6s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-16}}

    /* the 200 OK chip pops when the response lands, then fades before the next request */
    .ok{animation:ok 7s ease-out infinite}
    @keyframes ok{0%,10%{opacity:1;transform:translateY(0)}18%,94%{opacity:0;transform:translateY(4px)}97%,100%{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){*{animation:none !important} .ok{opacity:1}}
  </style>

  <g clip-path="url(#a-card)">
    <rect x="0" y="0" width="900" height="282" fill="#0d1117"/>
    <rect x="0" y="0" width="900" height="282" fill="url(#a-grid)"/>
    <rect x="0" y="0" width="900" height="1.5" fill="url(#a-hl)"/>
  </g>
  <rect x="1" y="1" width="898" height="280" rx="14" fill="none" stroke="#21262d"/>

  <text class="s h r"   x="44" y="48" style="animation-delay:.05s">How a request actually moves</text>
  <text class="m sub r" x="44" y="68" style="animation-delay:.12s">every tier below is one I own end to end</text>
  <text class="m sec r" x="856" y="34" text-anchor="end" style="animation-delay:.05s">02 &#8212; ARCHITECTURE</text>

  <!-- connector spine -->
  <line x1="110" y1="150" x2="790" y2="150" stroke="#21262d" stroke-width="1.5"/>

  <!-- halos under the nodes -->
  <g>
    <rect class="halo n1" x="45"  y="118" width="130" height="64" rx="10" fill="#4ec9b0" filter="url(#a-glow)"/>
    <rect class="halo n2" x="215" y="118" width="130" height="64" rx="10" fill="#4ec9b0" filter="url(#a-glow)"/>
    <rect class="halo n3" x="385" y="118" width="130" height="64" rx="10" fill="#4ec9b0" filter="url(#a-glow)"/>
    <rect class="halo n4" x="555" y="118" width="130" height="64" rx="10" fill="#4ec9b0" filter="url(#a-glow)"/>
    <rect class="halo n5" x="725" y="118" width="130" height="64" rx="10" fill="#4ec9b0" filter="url(#a-glow)"/>
  </g>

  <!-- nodes -->
  <g class="r" style="animation-delay:.22s">
    <g transform="translate(45,118)">
      <text class="m step" x="0" y="-10">01</text>
      <rect class="node n1" width="130" height="64" rx="10" fill="#11161d" stroke="#21262d" stroke-width="1.4"/>
      <text class="m nd"   x="16" y="27">browser</text>
      <text class="m nsub" x="16" y="45">ui &#183; routing</text>
    </g>
    <g transform="translate(215,118)">
      <text class="m step" x="0" y="-10">02</text>
      <rect class="node n2" width="130" height="64" rx="10" fill="#11161d" stroke="#21262d" stroke-width="1.4"/>
      <text class="m nd"   x="16" y="27">edge</text>
      <text class="m nsub" x="16" y="45">cdn &#183; cache</text>
    </g>
    <g transform="translate(385,118)">
      <text class="m step" x="0" y="-10">03</text>
      <rect class="node n3" width="130" height="64" rx="10" fill="#11161d" stroke="#21262d" stroke-width="1.4"/>
      <text class="m nd"   x="16" y="27">api</text>
      <text class="m nsub" x="16" y="45">auth &#183; validate</text>
    </g>
    <g transform="translate(555,118)">
      <text class="m step" x="0" y="-10">04</text>
      <rect class="node n4" width="130" height="64" rx="10" fill="#11161d" stroke="#21262d" stroke-width="1.4"/>
      <text class="m nd"   x="16" y="27">service</text>
      <text class="m nsub" x="16" y="45">domain logic</text>
    </g>
    <g transform="translate(725,118)">
      <text class="m step" x="0" y="-10">05</text>
      <rect class="node n5" width="130" height="64" rx="10" fill="#11161d" stroke="#21262d" stroke-width="1.4"/>
      <text class="m nd"   x="16" y="27">database</text>
      <text class="m nsub" x="16" y="45">mysql</text>
    </g>
  </g>

  <!-- request packet, left to right along the spine -->
  <g class="req">
    <rect x="80" y="149" width="30" height="2" rx="1" fill="url(#a-trail)"/>
    <circle cx="110" cy="150" r="7" fill="#4ec9b0" opacity=".3" filter="url(#a-glow)"/>
    <circle cx="110" cy="150" r="2.4" fill="#4ec9b0"/>
  </g>

  <!-- response path -->
  <text class="m lbl" x="44" y="220">RESPONSE</text>
  <line class="flow" x1="110" y1="216" x2="790" y2="216" stroke="#2d3542" stroke-width="1.5"/>
  <g class="res">
    <circle cx="110" cy="216" r="5" fill="#8b949e" opacity=".2" filter="url(#a-glow)"/>
    <circle cx="110" cy="216" r="2.2" fill="#8b949e"/>
  </g>

  <!-- outer g owns position, inner g owns the animation: a CSS transform would replace the attribute -->
  <g transform="translate(45,236)"><g class="ok">
    <rect width="66" height="20" rx="10" fill="#11161d" stroke="#4ec9b0" stroke-opacity=".55"/>
    <circle cx="12" cy="10" r="2.5" fill="#4ec9b0"/>
    <text class="m" x="22" y="14" font-size="10" fill="#4ec9b0">200 OK</text>
  </g></g>
</svg>
