<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 900 300" width="900" height="300" role="img"
     aria-label="Request lifecycle as a loop. A request zig-zags from browser to edge to API to service to database, then the response returns along the bottom to the browser, which shows 200 OK.">
  <title>Request lifecycle &#8212; one loop, browser to database and back</title>

  <defs>
    <clipPath id="a-card"><rect x="1" y="1" width="898" height="298" rx="14"/></clipPath>
    <pattern id="a-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f3eee4" fill-opacity=".07"/>
    </pattern>
    <linearGradient id="a-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ec9b0" stop-opacity="0"/><stop offset="50%" stop-color="#4ec9b0" stop-opacity=".55"/><stop offset="100%" stop-color="#4ec9b0" stop-opacity="0"/>
    </linearGradient>
    <filter id="a-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
    <!-- one closed loop: request across the top, response back along the bottom -->
    <path id="a-loop" d="M188 179 C207 179 207 121 226 121 L358 121 C377 121 377 179 396 179 L528 179 C547 179 547 121 566 121 L698 121 C717 121 717 179 736 179 L868 179 C892 179 892 248 868 248 L56 248 C32 248 32 179 56 179 L188 179 Z"/>
  </defs>

  <style>
    .m {font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .s {font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .h {fill:#f3eee4;font-size:17px;font-weight:620;letter-spacing:-.2px}
    .sub{fill:#8e887d;font-size:11px}
    .sec{fill:#8e887d;font-size:10px;letter-spacing:.18em}
    .lbl{fill:#756f66;font-size:9.5px;letter-spacing:.16em}
    .step{fill:#756f66;font-size:9px;letter-spacing:.12em}
    .nd {fill:#f3eee4;font-size:12.5px}
    .nsub{fill:#8e887d;font-size:10px}

    .r{animation:fadeUp .7s cubic-bezier(.2,.7,.3,1) both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}

    .edge{fill:none;stroke:#43505d;stroke-width:1.5}
    .req{fill:none;stroke:#4ec9b0;stroke-width:1.5;stroke-opacity:.5;stroke-dasharray:5 7;animation:dash 1.1s linear infinite}
    .res{fill:none;stroke:#8e887d;stroke-width:1.5;stroke-opacity:.45;stroke-dasharray:3 6;animation:dash 1.6s linear infinite reverse}
    @keyframes dash{to{stroke-dashoffset:-24}}

    .node{animation:lit 8s ease-in-out infinite}
    .halo{animation:halo 8s ease-in-out infinite;opacity:0}
    .n1{animation-delay:7.73s} .n2{animation-delay:.56s} .n3{animation-delay:1.38s} .n4{animation-delay:2.21s} .n5{animation-delay:3.04s}
    @keyframes lit {0%,3%{stroke:#4ec9b0}14%,100%{stroke:#43505d}}
    @keyframes halo{0%,3%{opacity:.32}14%,100%{opacity:0}}

    .ok{animation:ok 8s ease-out infinite}
    @keyframes ok{0%,9%{opacity:1;transform:translateY(0)}16%,95%{opacity:0;transform:translateY(4px)}98%,100%{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){*{animation:none !important} .pkt{display:none} .ok{opacity:1}}
  </style>

  <g clip-path="url(#a-card)">
    <rect x="0" y="0" width="900" height="300" fill="#1c2129"/>
    <rect x="0" y="0" width="900" height="300" fill="url(#a-grid)"/>
    <rect x="0" y="0" width="900" height="1.5" fill="url(#a-hl)"/>
  </g>
  <rect x="1" y="1" width="898" height="298" rx="14" fill="none" stroke="#363f4a"/>

  <text class="s h r"   x="44" y="48" style="animation-delay:.05s">How a request actually moves</text>
  <text class="m sub r" x="44" y="68" style="animation-delay:.12s">one loop &#8212; every tier on it is one I own end to end</text>
  <text class="m sec r" x="856" y="34" text-anchor="end" style="animation-delay:.05s">02 &#8212; ARCHITECTURE</text>

  <!-- legend -->
  <g class="r" style="animation-delay:.5s">
    <line x1="700" y1="65" x2="724" y2="65" class="req"/>
    <text class="m lbl" x="730" y="68">REQUEST</text>
    <line x1="792" y1="65" x2="816" y2="65" class="res"/>
    <text class="m lbl" x="822" y="68">RESPONSE</text>
  </g>

  <!-- edges: quiet base plus animated overlays -->
  <g class="r" style="animation-delay:.3s">
    <path class="edge" d="M188 179 C207 179 207 121 226 121"/>
    <path class="edge" d="M358 121 C377 121 377 179 396 179"/>
    <path class="edge" d="M528 179 C547 179 547 121 566 121"/>
    <path class="edge" d="M698 121 C717 121 717 179 736 179"/>
    <path class="edge" d="M868 179 C892 179 892 248 868 248 L56 248 C32 248 32 179 56 179"/>

    <path class="req" d="M188 179 C207 179 207 121 226 121"/>
    <path class="req" d="M358 121 C377 121 377 179 396 179"/>
    <path class="req" d="M528 179 C547 179 547 121 566 121"/>
    <path class="req" d="M698 121 C717 121 717 179 736 179"/>
    <path class="res" d="M868 179 C892 179 892 248 868 248 L56 248 C32 248 32 179 56 179"/>
    <text class="m lbl" x="462" y="266" text-anchor="middle">RESPONSE &#8592;</text>
  </g>

  <!-- halos under the nodes -->
  <rect class="halo n1" x="56"  y="150" width="132" height="58" rx="10" fill="#4ec9b0" filter="url(#a-glow)"/>
  <rect class="halo n2" x="226" y="92"  width="132" height="58" rx="10" fill="#4ec9b0" filter="url(#a-glow)"/>
  <rect class="halo n3" x="396" y="150" width="132" height="58" rx="10" fill="#4ec9b0" filter="url(#a-glow)"/>
  <rect class="halo n4" x="566" y="92"  width="132" height="58" rx="10" fill="#4ec9b0" filter="url(#a-glow)"/>
  <rect class="halo n5" x="736" y="150" width="132" height="58" rx="10" fill="#4ec9b0" filter="url(#a-glow)"/>

  <!-- the packet, drawn under the nodes so it passes through them -->
  <g class="pkt">
    <circle r="7" fill="#4ec9b0" opacity=".3" filter="url(#a-glow)">
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="paced"><mpath xlink:href="#a-loop"/></animateMotion>
    </circle>
    <circle r="2.6" fill="#4ec9b0">
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="paced"><mpath xlink:href="#a-loop"/></animateMotion>
    </circle>
  </g>

  <!-- nodes, zig-zagged so the path has somewhere to go -->
  <g class="r" style="animation-delay:.22s">
    <g transform="translate(56,150)">
      <rect class="node n1" width="132" height="58" rx="10" fill="#262d36" stroke="#43505d" stroke-width="1.4"/>
      <text class="m step" x="120" y="16" text-anchor="end">01</text>
      <text class="m nd"   x="16" y="26">browser</text>
      <text class="m nsub" x="16" y="44">ui &#183; routing</text>
    </g>
    <g transform="translate(226,92)">
      <rect class="node n2" width="132" height="58" rx="10" fill="#262d36" stroke="#43505d" stroke-width="1.4"/>
      <text class="m step" x="120" y="16" text-anchor="end">02</text>
      <text class="m nd"   x="16" y="26">edge</text>
      <text class="m nsub" x="16" y="44">cdn &#183; cache</text>
    </g>
    <g transform="translate(396,150)">
      <rect class="node n3" width="132" height="58" rx="10" fill="#262d36" stroke="#43505d" stroke-width="1.4"/>
      <text class="m step" x="120" y="16" text-anchor="end">03</text>
      <text class="m nd"   x="16" y="26">api</text>
      <text class="m nsub" x="16" y="44">auth &#183; validate</text>
    </g>
    <g transform="translate(566,92)">
      <rect class="node n4" width="132" height="58" rx="10" fill="#262d36" stroke="#43505d" stroke-width="1.4"/>
      <text class="m step" x="120" y="16" text-anchor="end">04</text>
      <text class="m nd"   x="16" y="26">service</text>
      <text class="m nsub" x="16" y="44">domain logic</text>
    </g>
    <g transform="translate(736,150)">
      <rect class="node n5" width="132" height="58" rx="10" fill="#262d36" stroke="#43505d" stroke-width="1.4"/>
      <text class="m step" x="120" y="16" text-anchor="end">05</text>
      <text class="m nd"   x="16" y="26">database</text>
      <text class="m nsub" x="16" y="44">mysql</text>
    </g>
  </g>

  <!-- 200 OK pops under the browser as the response arrives -->
  <g transform="translate(56,218)"><g class="ok">
    <rect width="66" height="20" rx="10" fill="#262d36" stroke="#4ec9b0" stroke-opacity=".6"/>
    <circle cx="12" cy="10" r="2.5" fill="#4ec9b0"/>
    <text class="m" x="22" y="14" font-size="10" fill="#4ec9b0">200 OK</text>
  </g></g>
</svg>
