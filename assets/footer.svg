<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="900" height="140" role="img"
     aria-label="Footer. Thanks for scrolling. Always open to a good problem. f73tu99-design, built with SVG and GitHub Actions.">
  <title>Thanks for scrolling</title>
  <defs>
    <clipPath id="f-card"><rect x="1" y="1" width="898" height="138" rx="14"/></clipPath>
    <pattern id="f-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f0f6fc" fill-opacity=".055"/>
    </pattern>
    <linearGradient id="f-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ec9b0" stop-opacity="0"/><stop offset="50%" stop-color="#4ec9b0" stop-opacity=".55"/><stop offset="100%" stop-color="#4ec9b0" stop-opacity="0"/>
    </linearGradient>
    <filter id="f-glow" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <style>
    .m {font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .wave path{fill:none;stroke:#4ec9b0;stroke-width:1.4;stroke-opacity:.45}
    .w1{animation:drift 9s linear infinite}
    .w2{animation:drift 13s linear infinite reverse;stroke-opacity:.2}
    .w3{animation:drift 9s linear infinite;stroke-width:5;stroke-opacity:.14;filter:url(#f-glow)}
    @keyframes drift{to{transform:translateX(-300px)}}
    .r{animation:fade 1s ease both}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none !important}}
  </style>

  <g clip-path="url(#f-card)">
    <rect x="0" y="0" width="900" height="140" fill="#141a21"/>
    <rect x="0" y="0" width="900" height="140" fill="url(#f-grid)"/>
    <!-- waves live in their own band (y 100-124), clear of the text -->
    <g class="wave">
      <path class="w3" d="M-300 110 q 75 -10 150 0 t 150 0 t 150 0 t 150 0 t 150 0 t 150 0 t 150 0 t 150 0"/>
      <path class="w1" d="M-300 110 q 75 -10 150 0 t 150 0 t 150 0 t 150 0 t 150 0 t 150 0 t 150 0 t 150 0"/>
      <path class="w2" d="M-300 116 q 100 -8 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0"/>
    </g>
    <rect x="0" y="0" width="900" height="1.5" fill="url(#f-fade)"/>
  </g>
  <rect x="1" y="1" width="898" height="138" rx="14" fill="none" stroke="#2b3440"/>

  <text class="m r" x="450" y="46" text-anchor="middle" font-size="13" fill="#c9d1d9" style="animation-delay:.2s">thanks for scrolling</text>
  <text class="m r" x="450" y="66" text-anchor="middle" font-size="11" fill="#7d8590" style="animation-delay:.35s">always open to a good problem</text>
  <text class="m r" x="450" y="86" text-anchor="middle" font-size="9.5" fill="#636e7b" letter-spacing=".12em" style="animation-delay:.5s">@F73TU99-DESIGN &#183; HAND-DRAWN SVG &#183; REFRESHED BY GITHUB ACTIONS</text>
</svg>
