<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img"
     aria-label="Stack, grouped by layer. Frontend: TypeScript, JavaScript, Blade, CSS, Vite. Backend: PHP, Laravel, Eloquent, REST, Queues. Data: MySQL, SQL, Migrations, Seeders, Caching. Ops: Git, GitHub Actions, Composer, Docker, Linux.">
  <title>Stack &#8212; grouped by layer</title>

  <defs>
    <pattern id="s-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#e6edf3" fill-opacity=".035"/>
    </pattern>
    <linearGradient id="s-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ec9b0" stop-opacity="0"/><stop offset="50%" stop-color="#4ec9b0" stop-opacity=".55"/><stop offset="100%" stop-color="#4ec9b0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s-scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ec9b0" stop-opacity="0"/><stop offset="100%" stop-color="#4ec9b0" stop-opacity=".16"/>
    </linearGradient>
    <clipPath id="s-card"><rect x="1" y="1" width="898" height="298" rx="14"/></clipPath>
  </defs>

  <style>
    .m {font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .s {font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .h {fill:#e6edf3;font-size:17px;font-weight:620;letter-spacing:-.2px}
    .sub{fill:#636e7b;font-size:11px}
    .sec{fill:#636e7b;font-size:10px;letter-spacing:.18em}
    .col{fill:#4ec9b0;font-size:10.5px;letter-spacing:.17em}
    .chip rect{fill:#11161d;stroke:#21262d}
    .chip text{fill:#adbac7;font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}

    .r{animation:fadeUp .7s cubic-bezier(.2,.7,.3,1) both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    .rule{transform-box:fill-box;transform-origin:left center;animation:draw .8s cubic-bezier(.2,.8,.3,1) both}
    @keyframes draw{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
    .scan{animation:scan 8s linear infinite}
    @keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(300px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none !important} .scan{display:none}}
  </style>

  <g clip-path="url(#s-card)">
    <rect x="0" y="0" width="900" height="300" fill="#0d1117"/>
    <rect x="0" y="0" width="900" height="300" fill="url(#s-grid)"/>
    <rect class="scan" x="0" y="0" width="900" height="40" fill="url(#s-scan)"/>
    <rect x="0" y="0" width="900" height="1.5" fill="url(#s-hl)"/>
  </g>
  <rect x="1" y="1" width="898" height="298" rx="14" fill="none" stroke="#21262d"/>

  <text class="s h r"   x="44" y="50" style="animation-delay:.05s">Stack</text>
  <text class="m sub r" x="44" y="70" style="animation-delay:.12s">grouped by the layer it lives in, not by how loud the logo is</text>
  <text class="m sec r" x="856" y="34" text-anchor="end" style="animation-delay:.05s">01 &#8212; STACK</text>

  <g transform="translate(44,108)">
    <!-- FRONTEND -->
    <g>
      <text class="m col r" x="0" y="0" style="animation-delay:.20s">FRONTEND</text>
      <rect class="rule" x="0" y="9" width="170" height="1.5" fill="#4ec9b0" fill-opacity=".38" style="animation-delay:.24s"/>
      <g class="chip r" style="animation-delay:.30s"><rect x="0" y="22"  width="92" height="24" rx="6"/><text x="10" y="38">TypeScript</text></g>
      <g class="chip r" style="animation-delay:.34s"><rect x="0" y="52"  width="92" height="24" rx="6"/><text x="10" y="68">JavaScript</text></g>
      <g class="chip r" style="animation-delay:.38s"><rect x="0" y="82"  width="56" height="24" rx="6"/><text x="10" y="98">Blade</text></g>
      <g class="chip r" style="animation-delay:.42s"><rect x="0" y="112" width="42" height="24" rx="6"/><text x="10" y="128">CSS</text></g>
      <g class="chip r" style="animation-delay:.46s"><rect x="0" y="142" width="49" height="24" rx="6"/><text x="10" y="158">Vite</text></g>
    </g>
    <!-- BACKEND -->
    <g transform="translate(206,0)">
      <text class="m col r" x="0" y="0" style="animation-delay:.28s">BACKEND</text>
      <rect class="rule" x="0" y="9" width="170" height="1.5" fill="#4ec9b0" fill-opacity=".38" style="animation-delay:.32s"/>
      <g class="chip r" style="animation-delay:.38s"><rect x="0" y="22"  width="42" height="24" rx="6"/><text x="10" y="38">PHP</text></g>
      <g class="chip r" style="animation-delay:.42s"><rect x="0" y="52"  width="70" height="24" rx="6"/><text x="10" y="68">Laravel</text></g>
      <g class="chip r" style="animation-delay:.46s"><rect x="0" y="82"  width="78" height="24" rx="6"/><text x="10" y="98">Eloquent</text></g>
      <g class="chip r" style="animation-delay:.50s"><rect x="0" y="112" width="49" height="24" rx="6"/><text x="10" y="128">REST</text></g>
      <g class="chip r" style="animation-delay:.54s"><rect x="0" y="142" width="63" height="24" rx="6"/><text x="10" y="158">Queues</text></g>
    </g>
    <!-- DATA -->
    <g transform="translate(412,0)">
      <text class="m col r" x="0" y="0" style="animation-delay:.36s">DATA</text>
      <rect class="rule" x="0" y="9" width="170" height="1.5" fill="#4ec9b0" fill-opacity=".38" style="animation-delay:.40s"/>
      <g class="chip r" style="animation-delay:.46s"><rect x="0" y="22"  width="56" height="24" rx="6"/><text x="10" y="38">MySQL</text></g>
      <g class="chip r" style="animation-delay:.50s"><rect x="0" y="52"  width="42" height="24" rx="6"/><text x="10" y="68">SQL</text></g>
      <g class="chip r" style="animation-delay:.54s"><rect x="0" y="82"  width="92" height="24" rx="6"/><text x="10" y="98">Migrations</text></g>
      <g class="chip r" style="animation-delay:.58s"><rect x="0" y="112" width="70" height="24" rx="6"/><text x="10" y="128">Seeders</text></g>
      <g class="chip r" style="animation-delay:.62s"><rect x="0" y="142" width="70" height="24" rx="6"/><text x="10" y="158">Caching</text></g>
    </g>
    <!-- OPS -->
    <g transform="translate(618,0)">
      <text class="m col r" x="0" y="0" style="animation-delay:.44s">OPS</text>
      <rect class="rule" x="0" y="9" width="170" height="1.5" fill="#4ec9b0" fill-opacity=".38" style="animation-delay:.48s"/>
      <g class="chip r" style="animation-delay:.54s"><rect x="0" y="22"  width="42"  height="24" rx="6"/><text x="10" y="38">Git</text></g>
      <g class="chip r" style="animation-delay:.58s"><rect x="0" y="52"  width="121" height="24" rx="6"/><text x="10" y="68">GitHub Actions</text></g>
      <g class="chip r" style="animation-delay:.62s"><rect x="0" y="82"  width="78"  height="24" rx="6"/><text x="10" y="98">Composer</text></g>
      <g class="chip r" style="animation-delay:.66s"><rect x="0" y="112" width="63"  height="24" rx="6"/><text x="10" y="128">Docker</text></g>
      <g class="chip r" style="animation-delay:.70s"><rect x="0" y="142" width="56"  height="24" rx="6"/><text x="10" y="158">Linux</text></g>
    </g>
  </g>
</svg>
