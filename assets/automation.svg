<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 900 372" width="900" height="372" role="img"
     aria-label="Automation graph. Webhook and schedule triggers feed a validate condition; valid events go to a transform action which fans out to an API call and a store step, invalid events go to a notify action. A packet travels the pipeline continuously and a run log below lights up each step as it happens.">
  <title>Automation &#8212; triggers, conditions, actions</title>

  <defs>
    <clipPath id="au-card"><rect x="1" y="1" width="898" height="370" rx="14"/></clipPath>
    <pattern id="au-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f0f6fc" fill-opacity=".055"/>
    </pattern>
    <linearGradient id="au-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ec9b0" stop-opacity="0"/><stop offset="50%" stop-color="#4ec9b0" stop-opacity=".55"/><stop offset="100%" stop-color="#4ec9b0" stop-opacity="0"/>
    </linearGradient>
    <filter id="au-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
    <path id="au-route-ok"
          d="M194 146 C234 146 232 191 272 191 L422 191 C462 191 460 136 500 136 L650 136 C684 136 682 136 716 136"/>
    <path id="au-route-reject"
          d="M194 236 C234 236 232 191 272 191 L422 191 C462 191 460 246 500 246"/>
  </defs>

  <style>
    .m {font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .s {font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .h {fill:#f0f6fc;font-size:17px;font-weight:620;letter-spacing:-.2px}
    .sub{fill:#7d8590;font-size:11px}
    .sec{fill:#7d8590;font-size:10px;letter-spacing:.18em}
    .type{fill:#4ec9b0;font-size:9px;letter-spacing:.16em;opacity:.8}
    .name{fill:#f0f6fc;font-size:12.5px}
    .elbl{fill:#7d8590;font-size:9.5px;letter-spacing:.06em}
    .log{fill:#7d8590;font-size:11px}

    .r{animation:fadeUp .7s cubic-bezier(.2,.7,.3,1) both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}

    .edge{fill:none;stroke:#38424f;stroke-width:1.5}
    .flow{fill:none;stroke:#4ec9b0;stroke-width:1.5;stroke-opacity:.55;stroke-dasharray:5 7;animation:dash 1.1s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-24}}
    .handle{fill:#141a21;stroke:#4ec9b0;stroke-width:1.4;stroke-opacity:.85}

    .node{animation:lit 5s ease-in-out infinite}
    .halo{animation:halo 5s ease-in-out infinite;opacity:0}
    .n1{animation-delay:0s} .n3{animation-delay:.8s} .n4{animation-delay:3.05s} .n6{animation-delay:4.7s}
    @keyframes lit {0%,4%{stroke:#4ec9b0}22%,100%{stroke:#38424f}}
    @keyframes halo{0%,4%{opacity:.3}22%,100%{opacity:0}}

    /* run log: text stays put, the bullet and line heat up as each step fires */
    .hot{animation:hot 5s ease-out infinite}
    .hot text{animation:hott 5s ease-out infinite}
    .l1{animation-delay:0s} .l2{animation-delay:.8s} .l3{animation-delay:3.05s} .l4{animation-delay:4.7s}
    .l1 text{animation-delay:0s} .l2 text{animation-delay:.8s} .l3 text{animation-delay:3.05s} .l4 text{animation-delay:4.7s}
    @keyframes hot {0%,4%{fill:#4ec9b0;opacity:1}30%,100%{fill:#4ec9b0;opacity:.25}}
    @keyframes hott{0%,4%{fill:#f0f6fc}30%,100%{fill:#7d8590}}

    @media (prefers-reduced-motion:reduce){*{animation:none !important} .pkt{display:none}}
  </style>

  <g clip-path="url(#au-card)">
    <rect x="0" y="0" width="900" height="372" fill="#141a21"/>
    <rect x="0" y="0" width="900" height="372" fill="url(#au-grid)"/>
    <rect x="0" y="0" width="900" height="1.5" fill="url(#au-hl)"/>
  </g>
  <rect x="1" y="1" width="898" height="370" rx="14" fill="none" stroke="#2b3440"/>

  <text class="s h r"   x="44" y="48" style="animation-delay:.05s">Automation</text>
  <text class="m sub r" x="44" y="68" style="animation-delay:.12s">triggers, conditions, actions &#8212; wired as a graph, monitored like a service</text>
  <text class="m sec r" x="856" y="34" text-anchor="end" style="animation-delay:.05s">03 &#8212; AUTOMATION</text>

  <!-- legend, top right -->
  <g class="r" style="animation-delay:.5s">
    <rect x="620" y="60" width="2.5" height="10" fill="#4ec9b0" fill-opacity=".8"/>
    <text class="m elbl" x="630" y="68">trigger</text>
    <circle class="handle" cx="698" cy="65" r="3.5"/>
    <text class="m elbl" x="708" y="68">handle</text>
    <line x1="772" y1="65" x2="796" y2="65" class="flow"/>
    <text class="m elbl" x="804" y="68">live edge</text>
  </g>

  <!-- edges -->
  <g class="r" style="animation-delay:.30s">
    <path class="edge" d="M194 146 C234 146 232 191 272 191"/>
    <path class="edge" d="M194 236 C234 236 232 191 272 191"/>
    <path class="edge" d="M422 191 C462 191 460 136 500 136"/>
    <path class="edge" d="M422 191 C462 191 460 246 500 246"/>
    <path class="edge" d="M650 136 C684 136 682 136 716 136"/>
    <path class="edge" d="M650 136 C690 136 676 246 716 246"/>

    <path class="flow" d="M194 146 C234 146 232 191 272 191"/>
    <path class="flow" d="M194 236 C234 236 232 191 272 191"/>
    <path class="flow" d="M422 191 C462 191 460 136 500 136"/>
    <path class="flow" d="M422 191 C462 191 460 246 500 246" style="stroke:#8b949e;stroke-opacity:.4"/>
    <path class="flow" d="M650 136 C684 136 682 136 716 136"/>
    <path class="flow" d="M650 136 C690 136 676 246 716 246"/>

    <rect x="445" y="150" width="34" height="14" rx="4" fill="#141a21"/>
    <text class="m elbl" x="462" y="160" text-anchor="middle" fill="#4ec9b0" fill-opacity=".85">valid</text>
    <rect x="441" y="224" width="44" height="14" rx="4" fill="#141a21"/>
    <text class="m elbl" x="463" y="234" text-anchor="middle">invalid</text>
  </g>

  <!-- halos under the nodes on the happy path -->
  <rect class="halo n1" x="44"  y="120" width="150" height="52" rx="8" fill="#4ec9b0" filter="url(#au-glow)"/>
  <rect class="halo n3" x="272" y="165" width="150" height="52" rx="8" fill="#4ec9b0" filter="url(#au-glow)"/>
  <rect class="halo n4" x="500" y="110" width="150" height="52" rx="8" fill="#4ec9b0" filter="url(#au-glow)"/>
  <rect class="halo n6" x="716" y="110" width="140" height="52" rx="8" fill="#4ec9b0" filter="url(#au-glow)"/>

  <!-- packets, drawn under the nodes so they appear to pass through them -->
  <g class="pkt">
    <circle r="6" fill="#4ec9b0" opacity=".35" filter="url(#au-glow)">
      <animateMotion dur="5s" repeatCount="indefinite" calcMode="paced"><mpath xlink:href="#au-route-ok"/></animateMotion>
    </circle>
    <circle r="2.4" fill="#4ec9b0">
      <animateMotion dur="5s" repeatCount="indefinite" calcMode="paced"><mpath xlink:href="#au-route-ok"/></animateMotion>
    </circle>
    <circle r="2.2" fill="#9da8b3">
      <animateMotion dur="5s" begin="2.5s" repeatCount="indefinite" calcMode="paced"><mpath xlink:href="#au-route-reject"/></animateMotion>
    </circle>
  </g>

  <!-- nodes -->
  <g class="r" style="animation-delay:.20s">
    <g transform="translate(44,120)">
      <rect class="node n1" width="150" height="52" rx="8" fill="#1c232d" stroke="#38424f" stroke-width="1.4"/>
      <rect x="0" y="10" width="2.5" height="32" fill="#4ec9b0" fill-opacity=".8"/>
      <text class="m type" x="14" y="19">TRIGGER</text>
      <text class="m name" x="14" y="38">webhook</text>
      <circle class="handle" cx="150" cy="26" r="4"/>
    </g>
    <g transform="translate(44,210)">
      <rect width="150" height="52" rx="8" fill="#1c232d" stroke="#38424f" stroke-width="1.4"/>
      <rect x="0" y="10" width="2.5" height="32" fill="#4ec9b0" fill-opacity=".8"/>
      <text class="m type" x="14" y="19">TRIGGER</text>
      <text class="m name" x="14" y="38">schedule</text>
      <circle class="handle" cx="150" cy="26" r="4"/>
    </g>
    <g transform="translate(272,165)">
      <rect class="node n3" width="150" height="52" rx="8" fill="#1c232d" stroke="#38424f" stroke-width="1.4"/>
      <text class="m type" x="14" y="19">CONDITION</text>
      <text class="m name" x="14" y="38">validate</text>
      <circle class="handle" cx="0"   cy="26" r="4"/>
      <circle class="handle" cx="150" cy="26" r="4"/>
    </g>
    <g transform="translate(500,110)">
      <rect class="node n4" width="150" height="52" rx="8" fill="#1c232d" stroke="#38424f" stroke-width="1.4"/>
      <text class="m type" x="14" y="19">ACTION</text>
      <text class="m name" x="14" y="38">transform</text>
      <circle class="handle" cx="0"   cy="26" r="4"/>
      <circle class="handle" cx="150" cy="26" r="4"/>
    </g>
    <g transform="translate(500,220)">
      <rect width="150" height="52" rx="8" fill="#1c232d" stroke="#38424f" stroke-width="1.4"/>
      <text class="m type" x="14" y="19">ACTION</text>
      <text class="m name" x="14" y="38">notify</text>
      <circle class="handle" cx="0" cy="26" r="4"/>
    </g>
    <g transform="translate(716,110)">
      <rect class="node n6" width="140" height="52" rx="8" fill="#1c232d" stroke="#38424f" stroke-width="1.4"/>
      <text class="m type" x="14" y="19">ACTION</text>
      <text class="m name" x="14" y="38">api call</text>
      <circle class="handle" cx="0" cy="26" r="4"/>
    </g>
    <g transform="translate(716,220)">
      <rect width="140" height="52" rx="8" fill="#1c232d" stroke="#38424f" stroke-width="1.4"/>
      <text class="m type" x="14" y="19">ACTION</text>
      <text class="m name" x="14" y="38">store</text>
      <circle class="handle" cx="0" cy="26" r="4"/>
    </g>
  </g>

  <!-- run log, in sync with the packet -->
  <g class="r" style="animation-delay:.6s">
    <rect x="44" y="296" width="812" height="52" rx="10" fill="#171e27" stroke="#2b3440"/>
    <text class="m elbl" x="60" y="315">RUN LOG</text>
    <g class="hot l1"><circle cx="66"  cy="332" r="2.5"/><text class="m log" x="76"  y="336">webhook received</text></g>
    <g class="hot l2"><circle cx="266" cy="332" r="2.5"/><text class="m log" x="276" y="336">validate &#183; ok</text></g>
    <g class="hot l3"><circle cx="466" cy="332" r="2.5"/><text class="m log" x="476" y="336">transform &#183; done</text></g>
    <g class="hot l4"><circle cx="666" cy="332" r="2.5"/><text class="m log" x="676" y="336">api call &#183; 200</text></g>
  </g>
</svg>
