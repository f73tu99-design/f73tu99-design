<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 236" width="900" height="236" role="img"
     aria-label="Jasper, full-stack engineer. Handle f73tu99-design. Client, service and data layers shown as a connected stack. Status: open to opportunities.">
  <title>Jasper — Full-stack engineer</title>

  <defs>
    <linearGradient id="h-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4ec9b0" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#4ec9b0" stop-opacity=".85"/>
      <stop offset="55%"  stop-color="#4ec9b0" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#4ec9b0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#21262d"/>
      <stop offset="50%"  stop-color="#2f3540"/>
      <stop offset="100%" stop-color="#21262d"/>
    </linearGradient>
    <clipPath id="h-card"><rect x="1" y="1" width="898" height="234" rx="14"/></clipPath>
  </defs>

  <style>
    .m    {font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .s    {font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .name {fill:#e6edf3;font-size:35px;font-weight:650;letter-spacing:-.6px}
    .role {fill:#adbac7;font-size:15.5px}
    .mut  {fill:#7d8590;font-size:12.5px}
    .lbl  {fill:#636e7b;font-size:10.5px;letter-spacing:.16em}
    .acc  {fill:#4ec9b0}

    .r  {animation:fadeUp .75s cubic-bezier(.2,.7,.3,1) both}
    .d1 {animation-delay:.06s} .d2 {animation-delay:.20s} .d3 {animation-delay:.34s}
    .d4 {animation-delay:.48s} .d5 {animation-delay:.62s}
    @keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}

    .cur{animation:blink 1.15s steps(1) infinite}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

    .live{transform-box:fill-box;transform-origin:center;animation:live 2.6s ease-in-out infinite}
    @keyframes live{0%,100%{opacity:.4}50%{opacity:1}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.6s ease-out infinite}
    @keyframes ring{0%{transform:scale(.6);opacity:.55}70%,100%{transform:scale(2.4);opacity:0}}

    .sweep{animation:sweep 7s cubic-bezier(.6,0,.4,1) infinite}
    @keyframes sweep{0%{transform:translateX(-420px)}55%,100%{transform:translateX(900px)}}

    .pkt{animation:pkt 5.2s cubic-bezier(.65,0,.35,1) infinite}
    @keyframes pkt{
      0%       {transform:translateY(0);opacity:0}
      8%       {opacity:1}
      30%      {transform:translateY(0)}
      42%      {transform:translateY(52px)}
      64%      {transform:translateY(52px)}
      76%      {transform:translateY(104px)}
      92%      {transform:translateY(104px);opacity:1}
      100%     {transform:translateY(104px);opacity:0}
    }
     (prefers-reduced-motion:reduce){*{animation:none !important}}
  </style>

  <g clip-path="url(#h-card)">
    <rect x="0" y="0" width="900" height="236" fill="#0d1117"/>
    <rect class="sweep" x="0" y="0" width="420" height="2" fill="url(#h-sweep)"/>
  </g>
  <rect x="1" y="1" width="898" height="234" rx="14" fill="none" stroke="#21262d"/>

  <!-- ─── left column ─────────────────────────────────────────── -->
  <g transform="translate(44,0)">
    <text class="m r d1" x="0" y="58" font-size="12.5">
      <tspan class="acc">&#10095;</tspan><tspan class="mut" dx="8">whoami</tspan><tspan class="acc cur" dx="6">&#9608;</tspan>
    </text>

    <!-- EDIT: display name -->
    <text class="s name r d2" x="0" y="104">Jasper</text>

    <text class="s role r d3" x="0" y="133">Full-stack engineer</text>
    <text class="m mut r d4" x="0" y="157">I build the whole path &#8212; interface, API, data, deploy.</text>

    <g transform="translate(0,182)"><g class="r d5">
      <rect x="0" y="0" width="186" height="28" rx="14" fill="#11161d" stroke="#21262d"/>
      <circle class="ring" cx="18" cy="14" r="3.5" fill="none" stroke="#4ec9b0" stroke-width="1.2"/>
      <circle class="live" cx="18" cy="14" r="3.5" fill="#4ec9b0"/>
      <text class="m" x="32" y="18" font-size="11.5" fill="#8b949e">open to opportunities</text>
    </g></g>
  </g>

  <!-- ─── right column: the stack ─────────────────────────────── -->
  <g transform="translate(628,44)">
    <text class="m lbl" x="0" y="0">THE STACK</text>

    <!-- rail + travelling packet -->
    <rect x="5" y="14" width="1.5" height="118" fill="url(#h-rail)"/>
    <g class="pkt" transform="translate(0,0)">
      <circle cx="5.75" cy="32" r="4.5" fill="#4ec9b0" opacity=".18"/>
      <circle cx="5.75" cy="32" r="2.2" fill="#4ec9b0"/>
    </g>

    <g transform="translate(24,14)">
      <rect x="0" y="0"   width="204" height="32" rx="8" fill="#11161d" stroke="#21262d"/>
      <text class="m" x="14" y="20" font-size="11.5" fill="#adbac7">client</text>
      <text class="m" x="190" y="20" font-size="10" fill="#636e7b" text-anchor="end">Blade &#183; TS</text>

      <rect x="0" y="52"  width="204" height="32" rx="8" fill="#11161d" stroke="#21262d"/>
      <text class="m" x="14" y="72" font-size="11.5" fill="#adbac7">service</text>
      <text class="m" x="190" y="72" font-size="10" fill="#636e7b" text-anchor="end">PHP &#183; Laravel</text>

      <rect x="0" y="104" width="204" height="32" rx="8" fill="#11161d" stroke="#21262d"/>
      <text class="m" x="14" y="124" font-size="11.5" fill="#adbac7">data</text>
      <text class="m" x="190" y="124" font-size="10" fill="#636e7b" text-anchor="end">MySQL</text>
    </g>
  </g>
</svg>
