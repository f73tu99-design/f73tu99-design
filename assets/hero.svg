<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img"
     aria-label="Jasper, full-stack engineer working across Laravel, TypeScript and automation. Handle f73tu99-design. Client, service and data layers shown as a connected stack. Status: open to opportunities.">
  <title>Jasper &#8212; Full-stack engineer</title>

  <defs>
    <linearGradient id="h-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4ec9b0" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#4ec9b0" stop-opacity=".9"/>
      <stop offset="55%"  stop-color="#4ec9b0" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#4ec9b0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2b3440"/>
      <stop offset="50%"  stop-color="#2f3540"/>
      <stop offset="100%" stop-color="#2b3440"/>
    </linearGradient>
    <radialGradient id="h-halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 110) scale(320 200)">
      <stop offset="0%"   stop-color="#4ec9b0" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#4ec9b0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="h-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f0f6fc" fill-opacity=".055"/>
    </pattern>
    <filter id="h-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="h-card"><rect x="1" y="1" width="898" height="258" rx="14"/></clipPath>
  </defs>

  <style>
    .m    {font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .s    {font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .name {font-size:40px;font-weight:700;letter-spacing:-.8px}
    .role {fill:#c9d1d9;font-size:15.5px}
    .mut  {fill:#8b949e;font-size:12.5px}
    .lbl  {fill:#7d8590;font-size:10.5px;letter-spacing:.16em}
    .acc  {fill:#4ec9b0}

    .r  {animation:fadeUp .75s cubic-bezier(.2,.7,.3,1) both}
    .d1 {animation-delay:.06s} .d2 {animation-delay:.20s} .d3 {animation-delay:.34s}
    .d4 {animation-delay:.48s} .d5 {animation-delay:.62s} .d6 {animation-delay:.76s}
    @keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}

    /* cycling role line: each of the three shares one 9s clock, offset by 3s */
    .cyc{animation:cyc 9s ease-in-out infinite both}
    .c2{animation-delay:3s} .c3{animation-delay:6s}
    @keyframes cyc{0%{opacity:0;transform:translateY(5px)}4%,29%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(-4px)}}

    .cur{animation:blink 1.15s steps(1) infinite}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

    .glowt{animation:glowt 3.4s ease-in-out infinite}
    @keyframes glowt{0%,100%{opacity:.18}50%{opacity:.45}}

    .live{transform-box:fill-box;transform-origin:center;animation:live 2.6s ease-in-out infinite}
    @keyframes live{0%,100%{opacity:.4}50%{opacity:1}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.6s ease-out infinite}
    @keyframes ring{0%{transform:scale(.6);opacity:.55}70%,100%{transform:scale(2.4);opacity:0}}

    .sweep{animation:sweep 7s cubic-bezier(.6,0,.4,1) infinite}
    @keyframes sweep{0%{transform:translateX(-420px)}55%,100%{transform:translateX(900px)}}

    .orbit{transform-box:fill-box;transform-origin:center;animation:spin 70s linear infinite}
    .orbit2{transform-box:fill-box;transform-origin:center;animation:spin 110s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}

    .pkt{animation:pkt 5.2s cubic-bezier(.65,0,.35,1) infinite}
    @keyframes pkt{
      0%  {transform:translateY(0);opacity:0}
      8%  {opacity:1}
      30% {transform:translateY(0)}
      42% {transform:translateY(52px)}
      64% {transform:translateY(52px)}
      76% {transform:translateY(104px)}
      92% {transform:translateY(104px);opacity:1}
      100%{transform:translateY(104px);opacity:0}
    }
    @media (prefers-reduced-motion:reduce){*{animation:none !important} .c2,.c3{display:none}}
  </style>

  <g clip-path="url(#h-card)">
    <rect x="0" y="0" width="900" height="260" fill="#141a21"/>
    <rect x="0" y="0" width="900" height="260" fill="url(#h-grid)"/>
    <rect x="0" y="0" width="900" height="260" fill="url(#h-halo)"/>
    <rect class="sweep" x="0" y="0" width="420" height="2" fill="url(#h-sweep)"/>
  </g>
  <rect x="1" y="1" width="898" height="258" rx="14" fill="none" stroke="#2b3440"/>

  <!-- left column -->
  <g transform="translate(44,0)">
    <text class="m r d1" x="0" y="56" font-size="12.5">
      <tspan class="acc">&#10095;</tspan><tspan class="mut" dx="8">whoami</tspan><tspan class="acc cur" dx="6">&#9608;</tspan>
    </text>

    <!-- EDIT: display name (glow copy underneath, crisp copy on top) -->
    <text class="s name glowt" x="0" y="106" fill="#4ec9b0" filter="url(#h-glow)">Jasper</text>
    <text class="s name r d2" x="0" y="106" fill="#f0f6fc">Jasper</text>

    <g class="r d3">
      <text class="s role cyc c1" x="0" y="136">Full-stack engineer</text>
      <text class="s role cyc c2" x="0" y="136">Laravel <tspan class="acc">+</tspan> TypeScript, end to end</text>
      <text class="s role cyc c3" x="0" y="136">Automation that runs while you sleep</text>
    </g>

    <text class="m mut r d4" x="0" y="160">I build the whole path &#8212; interface, API, data, deploy.</text>

    <g transform="translate(0,186)">
      <g class="r d5">
        <rect x="0" y="0" width="186" height="28" rx="14" fill="#1c232d" stroke="#2b3440"/>
        <circle class="ring" cx="18" cy="14" r="3.5" fill="none" stroke="#4ec9b0" stroke-width="1.2"/>
        <circle class="live" cx="18" cy="14" r="3.5" fill="#4ec9b0"/>
        <text class="m" x="32" y="18" font-size="11.5" fill="#9da8b3">open to opportunities</text>
      </g>
      <g class="r d6">
        <rect x="198" y="0" width="142" height="28" rx="14" fill="#1c232d" stroke="#2b3440"/>
        <text class="m" x="212" y="18" font-size="11.5" fill="#9da8b3"><tspan class="acc">@</tspan>f73tu99-design</text>
      </g>
    </g>

    <text class="m lbl r d6" x="0" y="238">LARAVEL &#183; TYPESCRIPT &#183; AUTOMATION &#183; MYSQL</text>
  </g>

  <!-- right column: the stack, with slow orbital rings behind it -->
  <g transform="translate(628,48)">
    <circle class="orbit"  cx="126" cy="75" r="112" fill="none" stroke="#38424f" stroke-width="1" stroke-dasharray="2 9" opacity=".7"/>
    <circle class="orbit2" cx="126" cy="75" r="132" fill="none" stroke="#2b3440" stroke-width="1" stroke-dasharray="1 14"/>

    <text class="m lbl" x="0" y="0">THE STACK</text>

    <rect x="5" y="14" width="1.5" height="118" fill="url(#h-rail)"/>
    <g class="pkt">
      <circle cx="5.75" cy="32" r="6" fill="#4ec9b0" opacity=".25" filter="url(#h-glow)"/>
      <circle cx="5.75" cy="32" r="2.2" fill="#4ec9b0"/>
    </g>

    <g transform="translate(24,14)">
      <rect x="0" y="0"   width="204" height="32" rx="8" fill="#1c232d" stroke="#2b3440"/>
      <text class="m" x="14" y="20" font-size="11.5" fill="#c9d1d9">client</text>
      <text class="m" x="190" y="20" font-size="10" fill="#7d8590" text-anchor="end">Blade &#183; TS</text>

      <rect x="0" y="52"  width="204" height="32" rx="8" fill="#1c232d" stroke="#2b3440"/>
      <text class="m" x="14" y="72" font-size="11.5" fill="#c9d1d9">service</text>
      <text class="m" x="190" y="72" font-size="10" fill="#7d8590" text-anchor="end">PHP &#183; Laravel</text>

      <rect x="0" y="104" width="204" height="32" rx="8" fill="#1c232d" stroke="#2b3440"/>
      <text class="m" x="14" y="124" font-size="11.5" fill="#c9d1d9">data</text>
      <text class="m" x="190" y="124" font-size="10" fill="#7d8590" text-anchor="end">MySQL</text>
    </g>
  </g>
</svg>
