<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="Contribution snake animation, generated on the first scheduled workflow run.">
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .p{animation:p 2.2s ease-in-out infinite}
    @keyframes p{0%,100%{opacity:.35}50%{opacity:.9}}
    @media (prefers-reduced-motion:reduce){*{animation:none !important}}
  </style>
  <rect x="1" y="1" width="878" height="198" rx="14" fill="#0d1117" stroke="#21262d"/>
  <circle class="p" cx="440" cy="76" r="3.5" fill="#4ec9b0"/>
  <text class="m" text-anchor="middle" x="440" y="106" font-size="12" fill="#7d8590">contribution snake</text>
  <text class="m" text-anchor="middle" x="440" y="126" font-size="10" fill="#636e7b">renders here after the first workflow run</text>
</svg>
