name: profile metrics

# Regenerates the data-driven panels (stats, languages, activity) and the
# contribution snake, then commits them back if anything actually changed.
#
# TOKEN NOTE -------------------------------------------------------------
# The built-in GITHUB_TOKEN can only see PUBLIC data. Every one of this
# account's repos is private, so with the default token the panels render
# as near-empty. To show real numbers, create a fine-grained or classic PAT
# with  read:user  (and  repo  if you want private repos counted toward the
# language split), save it as the repo secret METRICS_TOKEN, and this
# workflow picks it up automatically.
# ------------------------------------------------------------------------

on:
  schedule:
    - cron: '17 */6 * * *'   # four times a day, off the hour to dodge peak load
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/profile-metrics.yml'

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Render metric panels
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/generate.mjs

      - name: Render contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Dot colours match the panel theme; the card around it is added next.
          outputs: |
            assets/snake.svg?color_snake=#4ec9b0&color_dots=#2b3440,#1f4d44,#2a7a6a,#3aa68e,#4ec9b0

      - name: Frame the snake in the panel chrome
        run: node scripts/frame-snake.mjs

      - name: Commit if anything changed
        run: |
          # Commit as the profile owner so the bot never appears in Contributors.
          git config user.name  'f73tu99-design'
          git config user.email '289509406+f73tu99-design@users.noreply.github.com'
          git add assets/
          if git diff --staged --quiet; then
            echo 'No panel changes - nothing to commit.'
          else
            git commit -m 'chore: refresh profile panels [skip ci]'
            git push
          fi
